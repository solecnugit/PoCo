[package]
name = "media-transcoding-contract-rs"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.4.0", features = ["unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
# near-workspaces = "0.18.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true